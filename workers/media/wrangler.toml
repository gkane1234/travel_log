name = "travel-log"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

routes = [
  { pattern = "gabriel-kane.com/travel-log*", zone_name = "gabriel-kane.com" }
]

[[r2_buckets]]
binding = "TRIPS"
bucket_name = "travel-log-media"

# Do not put keys in this file.
# Set them with: npx wrangler secret put NAME
# S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
# S3_REGION, MEDIA_BASE_URL, MEDIA_PASSWORD,
# GITHUB_REPOSITORY, UPLOAD_TOKEN
